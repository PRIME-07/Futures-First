version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: analytics_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  mongodb:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  postgres_movies:
    image: postgres:15
    environment:
      POSTGRES_DB: movies_db
      POSTGRES_USER: movie_user
      POSTGRES_PASSWORD: movie_password
    volumes:
      - postgres_movies_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  postgres_automotive:
    image: postgres:15
    environment:
      POSTGRES_DB: automotive_db
      POSTGRES_USER: automotive_user
      POSTGRES_PASSWORD: automotive_password
    volumes:
      - postgres_automotive_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  mysql_ecommerce:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ecommerce_db
      MYSQL_USER: ecommerce_user
      MYSQL_PASSWORD: ecommerce_password
      MYSQL_ROOT_PASSWORD: ecommerce_root_password
    volumes:
      - mysql_ecommerce_data:/var/lib/mysql
    ports:
      - "3307:3306"

  api:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    depends_on:
      - postgres
      - mongodb
      - postgres_movies
      - postgres_automotive
      - mysql_ecommerce
    environment:
      # Override local URLs with container hostnames
      POSTGRES_URL: "postgresql://user:password@postgres:5432/analytics_db"
      MONGO_URL: "mongodb://mongodb:27017"
      MONGO_DB: "analytics"
    env_file:
      - .env
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  mongo_data:
  postgres_movies_data:
  postgres_automotive_data:
  mysql_ecommerce_data:
